<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мудрости Империи</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            padding: 60px 20px;
            box-sizing: border-box;
        }
        h1 {
            color: purple;
            font-size: 48px;
            margin: 0 0 50px 0;
            text-align: center;
        }
        .quotes {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
        }
        .quote {
            background: #222;
            border: 2px solid purple;
            border-radius: 10px;
            padding: 25px;
            width: 300px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .quote .text {
            color: #dddddd;
            font-size: 18px;
            line-height: 1.5;
            font-style: italic;
            margin: 0 0 20px 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .quote .author {
            color: purple;
            font-size: 16px;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <script>
        const role = sessionStorage.getItem('role');
        const allowed = ['Чиновник', 'Император'];
        if (!allowed.includes(role)) {
            document.body.innerHTML = '<p style="color:#aaa;font-family:Arial;text-align:center;margin-top:100px;">Доступ только для чиновников и Императора.</p>';
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    </script>

    <h1>Мудрости Империи</h1>

    <div class="quotes">

        <div class="quote">
            <p class="text">«Империя превыше всего.»</p>
            <p class="author">— Император</p>
        </div>

        <div class="quote">
            <p class="text">«Верность — не долг, а честь.»</p>
            <p class="author">— Первый Чиновник</p>
        </div>

        <div class="quote">
            <p class="text">«Сила Империи — в её жителях.»</p>
            <p class="author">— Летописец</p>
        </div>

    </div>
</body>
</html>
