<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в Империю</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #ddd;
        }
        h1 { color: purple; }
        input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid purple;
            border-radius: 6px;
            background: #222;
            color: #fff;
            text-align: center;
        }
        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            background: purple;
            color: #fff;
            border: none;
            border-radius: 6px;
        }
        button:hover { background: #6a0dad; }
        #result { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Вход в Империю</h1>
    <input id="codeInput" placeholder="Введите ваш код">
    <button id="loginBtn">Войти</button>
    <p id="result"></p>

    <script>
        const ROLES = {
            'IMPERATOR': 'Император',
            'CHINOVNIK': 'Чиновник',
            'ZHITEL': 'Житель'
        };

        const input = document.getElementById('codeInput');
        const result = document.getElementById('result');
        const button = document.getElementById('loginBtn');

        function login() {
            const code = input.value.trim().toUpperCase();
            const role = ROLES[code];

            if (role) {
                localStorage.setItem('role', role);
                result.style.color = 'lightgreen';
                result.textContent = 'Добро пожаловать, ' + role + '!';
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                result.style.color = 'red';
                result.textContent = 'Неверный код.';
            }
        }

        button.addEventListener('click', login);

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
