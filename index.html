<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Империя</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            position: relative;
        }
        #userRole {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #aaa;
            font-size: 16px;
        }
        #logoutBtn {
            position: absolute;
            top: 50px;
            right: 30px;
            background: purple;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #logoutBtn:hover { background: #6a0dad; }

        #imperialPanel {
            position: absolute;
            top: 100px;
            right: 30px;
            background: #222;
            border: 2px solid purple;
            border-radius: 10px;
            padding: 20px;
            width: 220px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        #imperialPanel h3 {
            color: purple;
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
        }
        #topSecretBtn {
            background: #c00000;
            color: #fff;
            border: 2px solid #ff3333;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        #topSecretBtn:hover {
            background: #ff0000;
            box-shadow: 0 0 12px #ff3333;
        }

        h1 {
            color: purple;
            font-size: 48px;
            margin: 0 0 10px 0;
        }
        p {
            color: #dddddd;
            font-size: 22px;
            margin: 0 0 40px 0;
        }
        a {
            color: blue;
            font-size: 18px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="userRole"></div>
    <button id="logoutBtn" style="display:none;">Выйти</button>

    <div id="imperialPanel">
        <h3>Панель Императора</h3>
        <button id="topSecretBtn">TOP SECRET</button>
    </div>

    <h1>Добро пожаловать</h1>
    <p>Империя приветствует вас</p>
    <a href="postulaty.html">Постулаты Империи</a>
    <br><br>
    <a href="#" onclick="goToMudrosti(); return false;">Мудрости Империи</a>
    <br><br>
    <a href="login.html">Войти</a>

    <script>
        const role = localStorage.getItem('role');
        const userRole = document.getElementById('userRole');
        const logoutBtn = document.getElementById('logoutBtn');
        const imperialPanel = document.getElementById('imperialPanel');

        userRole.textContent = role ? 'Вы: ' + role : 'Вы: Гость';

        if (role) {
            logoutBtn.style.display = 'block';
        }

        if (role === 'Император') {
            imperialPanel.style.display = 'flex';
        }

        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('role');
            window.location.reload();
        });

        const topSecretBtn = document.getElementById('topSecretBtn');
        topSecretBtn.addEventListener('click', function() {
            const pass = prompt('Введите секретный код:');
            if (pass === 'BrBrPatapim') {
                window.location.href = 'secret.html';
            } else if (pass !== null) {
                alert('Доступ запрещён.');
            }
        });

        function goToMudrosti() {
            const allowed = ['Чиновник', 'Император'];
            if (allowed.includes(role)) {
                window.location.href = 'mudrosti.html';
            } else {
                alert('Доступ только для чиновников и Императора.');
            }
        }
    </script>
</body>
</html>
