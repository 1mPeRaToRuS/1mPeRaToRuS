<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TOP SECRET — 1</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .layout {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: flex-start;
            flex: 1;
        }

        .video-block {
            flex: 1 1 600px;
            max-width: 720px;
        }

        .video-block iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 10px;
            display: block;
            background: #000;
        }

        .video-title {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .description {
            flex: 1 1 300px;
            color: #cccccc;
            font-size: 16px;
            line-height: 1.6;
            background: #1a1a1a;
            border-left: 3px solid #c00000;
            padding: 20px;
            border-radius: 8px;
        }

        .description h2 {
            color: #ff3333;
            font-size: 20px;
            margin: 0 0 15px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid #333;
        }

        .pagination a, .pagination span {
            color: #ccc;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 14px;
            border-radius: 6px;
            background: #1a1a1a;
            border: 1px solid #333;
            transition: 0.2s;
        }

        .pagination a:hover {
            background: #c00000;
            color: #fff;
            border-color: #c00000;
        }

        .pagination .current {
            background: #c00000;
            color: #fff;
            border-color: #c00000;
            font-weight: bold;
        }

        .pagination .disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="layout">
        <div class="video-block">
            <p class="video-title">ВИДЕО №1</p>
            <iframe 
                src="https://drive.google.com/file/d/1KCrOLjCVbCNRAPtA_aRebtRX49pdqQ_X/preview" 
                allow="autoplay">
            </iframe>
        </div>

        <div class="description">
            <h2>Описание</h2>
            <p>Первый секретный файл. Справа — описание, ниже — навигация.</p>
        </div>
    </div>

    <div class="pagination">
        <span class="disabled">←</span>
        <span class="current">1</span>
        <span class="disabled">→</span>
    </div>

</body>
</html>
